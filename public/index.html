    /* ==================== 播放历史 ==================== */

    let lastHistorySave = 0;

    function saveHistory(force = false) {
      if (!currentDetail) return;
      const v = document.getElementById('h5Player');
      const source = currentDetail.playSources && currentDetail.playSources[currentSourceIdx];
      const ep = source && source.episodes && source.episodes[currentEpIdx];
      if (!ep) return;

      const t = Date.now();
      if (!force && t - lastHistorySave < 8000) return;
      lastHistorySave = t;

      fetch('/api/history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          siteKey: currentDetail.siteKey || activeSiteKey,
          vodId: currentDetail.vod_id,
          vodName: currentDetail.vod_name,
          vodPic: currentDetail.vod_pic,
          source: source.sourceName,
          epName: ep.title,
          epIndex: currentEpIdx,
          epUrl: ep.url,
          position: isFinite(v.currentTime) ? v.currentTime : 0,
          duration: isFinite(v.duration) ? v.duration : 0
        })
      }).catch(() => {});
    }

    function renderSources() {
      const container = document.getElementById('mSourceTabs');
      container.innerHTML = '';
      if (!currentDetail.playSources || currentDetail.playSources.length === 0) {
        container.innerHTML = '<span style="color:#777">未发现有效播放线路</span>';
        return;
      }

      // 有历史记录时，优先回到上次看的线路
      const h = currentDetail.history;
      currentSourceIdx = 0;
      if (h && h.source) {
        const idx = currentDetail.playSources.findIndex(s => s.sourceName === h.source);
        if (idx >= 0) currentSourceIdx = idx;
      }

      currentDetail.playSources.forEach((src, idx) => {
        const tab = document.createElement('div');
        tab.className = `source-tab ${idx === currentSourceIdx ? 'active' : ''}`;
        tab.textContent = src.sourceName;
        tab.onclick = () => {
          document.querySelectorAll('.source-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentSourceIdx = idx;
          renderEpisodes(true);
        };
        container.appendChild(tab);
      });

      renderEpisodes();
    }

    function renderEpisodes(isManualSwitch = false) {
      const container = document.getElementById('mEpisodes');
      container.innerHTML = '';
      const source = currentDetail.playSources[currentSourceIdx];
      if (!source || !source.episodes) return;

      const h = currentDetail.history;
      let startIdx = 0;
      let resumeAt = 0;
      if (h && !isManualSwitch && (!h.source || h.source === source.sourceName)) {
        startIdx = Math.min(Math.max(0, Number(h.ep_index) || 0), source.episodes.length - 1);
        resumeAt = Number(h.position) || 0;
      }
      // 从「同片源」切换过来：尽量停留在同一集
      if (pendingEpIdx !== null && pendingEpIdx !== undefined) {
        startIdx = Math.min(Math.max(0, pendingEpIdx), source.episodes.length - 1);
        resumeAt = 0;
        pendingEpIdx = null;
      }

      currentEpIdx = startIdx;
      source.episodes.forEach((ep, idx) => {
        const btn = document.createElement('button');
        btn.className = `ep-btn ${idx === startIdx ? 'active' : ''}`;
        btn.textContent = ep.title;
        btn.onclick = () => {
          document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEpIdx = idx;
          playEpisode(ep.url, 0);
        };
        container.appendChild(btn);
      });

      if (source.episodes.length > 0) {
        playEpisode(source.episodes[startIdx].url, resumeAt);
        if (resumeAt > 0) {
          showToast(`已从上次进度继续：${source.episodes[startIdx].title} ${fmtTime(resumeAt)}`, 2600);
        }
      }
      const label = document.getElementById('pvPanelLabel');
      if (label) label.textContent = `选集 · ${source.sourceName} · 共 ${source.episodes.length} 集`;
    }

    function showToast(text, timeout = 2600) {
      const el = document.getElementById('pvToast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), timeout);
    }

    const DIRECT_MEDIA_RE = /\.(m3u8|mp4|flv|mkv|ts|webm|mp3|m4a)(\?|#|$)/i;
    let playToken = 0;

    async function playEpisode(url, resumeAt = 0) {
      const token = ++playToken;
      const video = document.getElementById('h5Player');

      // 彻底重置媒体元素：只销毁 hls 实例时，video 上残留的 MediaSource
      // 会把旧的解码状态带到新流上，换源/切集后容易出现怪声
      try { video.pause(); } catch (e) {}
      if (hls) {
        try { hls.destroy(); } catch (e) {}
        hls = null;
      }
      video.removeAttribute('src');
      try { video.load(); } catch (e) {}

      video.onerror = () => showToast('直连播放失败，可点右上角「用 PC 播放器播放」');
      showToast('正在加载视频...', 1500);

      // 有些源给的是网页播放页，需要先解析出真实视频地址
      let finalUrl = url;
      if (!DIRECT_MEDIA_RE.test(url)) {
        showToast('该源需要解析播放地址，正在解析…', 8000);
        try {
          const r = await (await fetch(`/api/resolve?url=${encodeURIComponent(url)}`)).json();
          if (token !== playToken) return;
          if (r.error || !r.url) throw new Error(r.error || '解析失败');
          finalUrl = r.url;
        } catch (e) {
          if (token !== playToken) return;
          showToast('这个源无法直接播放：' + e.message + '，建议换一个源', 6000);
          return;
        }
      }

      // 探测该流的封装质量：有 DISCONTINUITY（时间戳重置）时提示一次
      if (finalUrl.includes('.m3u8') && finalUrl !== window.__probeWarnedUrl) {
        window.__probeWarnedUrl = finalUrl;
        fetch(`/api/probe?url=${encodeURIComponent(finalUrl)}`)
          .then(r => r.json())
          .then(d => {
            const disc = d && d.disc ? d.disc : 0;
            showSourceWarn(disc);
            if (disc > 0) {
              if (autoExtEnabled()) {
                showToast(`该源有 ${disc} 处时间戳重置，已自动交给外部播放器`, 4000);
                setTimeout(() => playWithExternalPlayer(), 600);
              } else {
                showToast(`该源有 ${disc} 处时间戳重置，网页播放可能声音异常；可用外部播放器彻底避免`, 6000);
              }
            }
          })
          .catch(() => {});
      }

      const seek = () => {
        if (resumeAt > 1) {
          try { video.currentTime = resumeAt; } catch (e) {}
        }
      };

      if (finalUrl.includes('.m3u8')) {
        if (typeof Hls !== 'undefined' && Hls.isSupported()) {
          hls = new Hls({
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            backBufferLength: 30,      // 跳转后及时丢弃旧缓冲，避免解码器残留导致声音异常
            enableWorker: true,
            maxAudioFramesDrift: 5,    // 容忍音频时间戳轻微漂移，减少突然变调
            enableCEA708Captions: false,
            manifestLoadingTimeOut: 15000,
            fragLoadingTimeOut: 20000
          });
          hls.loadSource(finalUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            document.getElementById('pvToast').classList.remove('show');
            // 多音轨流固定用第一条，避免播放中途自动切换造成突变
            try {
              if (hls.audioTracks && hls.audioTracks.length > 1) hls.audioTrack = 0;
            } catch (e) {}
            seek();
            video.play().catch(() => showToast('浏览器阻止了自动播放，点一下播放键即可'));
          });
          // 音轨被切换时记录一下，便于定位
          hls.on(Hls.Events.AUDIO_TRACK_SWITCHED, () => { armAudioWatch(); });
          hls.on(Hls.Events.ERROR, (evt, data) => {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                showToast('线路加载失败，试试切换线路或外部播放器');
              } else {
                showToast('播放出错：' + (data.details || '未知错误'));
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = finalUrl;
          video.addEventListener('loadedmetadata', seek, { once: true });
          video.play().catch(() => {});
        } else {
          showToast('当前浏览器不支持 HLS 播放');
        }
      } else {
        video.src = finalUrl;
        video.addEventListener('loadedmetadata', seek, { once: true });
        video.play().catch(() => {});
      }
    }

    // 播放中定期写入历史（节流在 saveHistory 内部）
    document.getElementById('h5Player').addEventListener('timeupdate', () => saveHistory(false));
    document.getElementById('h5Player').addEventListener('pause', () => saveHistory(true));

    async function playWithExternalPlayer() {
      if (!currentDetail) return;
      const source = currentDetail.playSources[currentSourceIdx];
      if (!source || !source.episodes || !source.episodes[currentEpIdx]) return;

      const ep = source.episodes[currentEpIdx];
      const video = document.getElementById('h5Player');
      video.pause();

      const playerSel = document.getElementById('playerSel');
      const player = playerSel ? playerSel.value : '';
      savePlayerChoice(player);

      // 网页播放页需要先解析成直链，外部播放器才能打开
      let playUrl = ep.url;
      if (!DIRECT_MEDIA_RE.test(playUrl)) {
        showToast('正在解析播放地址…', 8000);
        try {
          const rr = await (await fetch(`/api/resolve?url=${encodeURIComponent(playUrl)}`)).json();
          if (rr.error || !rr.url) throw new Error(rr.error || '解析失败');
          playUrl = rr.url;
        } catch (e) {
          showToast('该源无法解析出直链：' + e.message + '，建议换个源', 6000);
          return;
        }
      }

      showToast('正在唤起外部播放器...', 4000);
      try {
        const resp = await fetch('/api/play/external', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: playUrl,
            title: `${currentDetail.vod_name} - ${ep.title}`,
            player
          })
        });
        const data = await resp.json();
        if (data.error) {
          showToast('唤起失败：' + data.error, 5000);
          return;
        }
        if (data.hasUi) {
          showToast(`已用 ${data.player} 打开（有完整播放界面）`, 3000);
        } else {
          showToast(`${data.player} 没有控制条，快捷键：空格 暂停 / ←→ 快进 / f 全屏 / q 退出`, 6000);
        }
      } catch (e) {
        showToast('唤起失败：' + e.message, 4000);
      }
    }

    function closePlayer() {
      saveHistory(true);
      const video = document.getElementById('h5Player');
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      video.pause();
      video.removeAttribute('src');
      video.load();
      if (hls) {
        hls.destroy();
        hls = null;
      }
      document.getElementById('playerView').classList.remove('active');
      document.body.style.overflow = '';
      hideBars();
    }

    // 全屏时控制条自动隐藏；窗口模式下始终显示
    let barTimer = null;
    function showBars() {
      clearTimeout(barTimer);
      const ctrls = document.getElementById('pvControls');
      if (!ctrls) return;
      ctrls.classList.remove('hidden');
      const v = document.getElementById('h5Player');
      if (document.fullscreenElement && v && !v.paused) {
        barTimer = setTimeout(() => ctrls.classList.add('hidden'), 2500);
      }
    }
    function hideBars() {
      clearTimeout(barTimer);
      const ctrls = document.getElementById('pvControls');
      if (ctrls) ctrls.classList.remove('hidden');
    }

    // 选集面板折叠
    function togglePanel() {
      const panel = document.getElementById('pvPanel');
      const collapsed = panel.classList.toggle('collapsed');
      document.getElementById('pvToggleBtn').textContent = collapsed ? '展开 ▾' : '收起 ▴';
    }
    function setPanelCollapsed(collapsed) {
      const panel = document.getElementById('pvPanel');
      panel.classList.toggle('collapsed', collapsed);
      document.getElementById('pvToggleBtn').textContent = collapsed ? '展开 ▾' : '收起 ▴';
    }
    document.getElementById('playerView').addEventListener('mousemove', showBars);
    document.getElementById('h5Player').addEventListener('play', showBars);
    document.getElementById('h5Player').addEventListener('pause', hideBars);
    document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) showBars(); });

    // ===== 自绘播放控制条 =====
    const pvVideo = document.getElementById('h5Player');
    const ICON = {
      play: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
      vol: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 10v4h3l4 4V6L6 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a6.99 6.99 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>',
      mute: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M3 10v4h3l4 4V6L6 10H3zm15.6 2l2.4-2.4-1.4-1.4L17.2 10.6 14.8 8.2l-1.4 1.4L15.8 12l-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4L18.6 12z"/></svg>',
      full: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M4 9V4h5v2H6v3H4zm16 0h-2V6h-3V4h5v5zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>',
      reload: '<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>'
    };

    function fmtTime(t) {
      if (!isFinite(t) || t < 0) return '0:00';
      t = Math.floor(t);
      const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
      return h > 0
        ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
        : `${m}:${String(s).padStart(2, '0')}`;
    }

    /* ===== 自绘滑块（指针捕获，可精确拖到 0% 与 100%） ===== */
    let seeking = false;

    function attachSlider(el, onDrag, onCommit) {
      let dragging = false;
      const pctOf = (e) => {
        const r = el.getBoundingClientRect();
        const p = (e.clientX - r.left) / Math.max(1, r.width);
        return Math.min(1, Math.max(0, p));
      };
      const move = (e) => {
        if (!dragging) return;
        onDrag(pctOf(e));
        e.preventDefault();
      };
      const up = (e) => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        document.removeEventListener('pointercancel', up);
        const p = pctOf(e);
        onDrag(p);
        if (onCommit) onCommit(p);
      };
      el.addEventListener('pointerdown', (e) => {
        dragging = true;
        el.classList.add('dragging');
        // 监听挂到 document，指针移出元件甚至移出窗口也不会丢事件
        document.addEventListener('pointermove', move);
        document.addEventListener('pointerup', up);
        document.addEventListener('pointercancel', up);
        onDrag(pctOf(e));
        e.preventDefault();
      });
      return () => dragging;
    }

    function paintSlider(fillId, thumbId, pct) {
      const p = Math.min(1, Math.max(0, pct)) * 100;
      document.getElementById(fillId).style.width = p + '%';
      document.getElementById(thumbId).style.left = p + '%';
    }

    const isSeekDragging = attachSlider(
      document.getElementById('seekBar'),
      (p) => {
        // 拖动时只更新视觉与时间预览，松手才真正跳转（避免 HLS 频繁 SEEK）
        seeking = true;
        paintSlider('seekFill', 'seekThumb', p);
        const dur = isFinite(pvVideo.duration) ? pvVideo.duration : 0;
        if (dur > 0) {
          document.getElementById('ctrlTime').textContent =
            `${fmtTime(p * dur)} / ${fmtTime(dur)}`;
        }
      },
      (p) => {
        const dur = isFinite(pvVideo.duration) ? pvVideo.duration : 0;
        if (dur > 0) {
          const target = Math.min(dur - 0.1, Math.max(0, p * dur));
          seekTo(target);
        }
        seeking = false;
        updateControls();
      }
    );

    /**
     * 干净的跳转：暂停 → 停流 → 定位 → 恢复播放
     * 边播边硬改 currentTime 会让音频管线来不及重建，出现变调/发闷的怪声
     */
    function seekTo(target) {
      if (!isFinite(target) || target < 0) return;
      const wasPlaying = !pvVideo.paused;

      if (wasPlaying) pvVideo.pause();
      if (hls) { try { hls.stopLoad(); } catch (e) {} }

      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        pvVideo.removeEventListener('seeked', finish);
        if (hls) { try { hls.startLoad(target); } catch (e) {} }
        if (wasPlaying) pvVideo.play().catch(() => {});
        updateControls();
      };

      try { pvVideo.currentTime = target; } catch (e) { finish(); return; }
      pvVideo.addEventListener('seeked', finish, { once: true });
      // 兜底：某些流不触发 seeked
      setTimeout(finish, 2500);
    }

    // 重载当前集（音频异常时的逃生口）
    function reloadCurrentEpisode(silent = false) {
      if (!currentDetail) return;
      const source = currentDetail.playSources && currentDetail.playSources[currentSourceIdx];
      const ep = source && source.episodes && source.episodes[currentEpIdx];
      if (!ep) return;
      const at = isFinite(pvVideo.currentTime) ? pvVideo.currentTime : 0;
      if (!silent) showToast('正在重载当前集…', 2500);
      playEpisode(ep.url, at);
    }

    /* ==================== 音频看门狗 ==================== */
    // 现象：播放一段时间后声音突然异常，点重载就恢复，说明媒体元素进了坏状态。
    // 用「音频解码字节数是否还在增长」来判断，卡住就自动重载（保持播放位置）。
    let audioWatchTimer = null;
    let lastAudioBytes = -1;
    let audioStallCount = 0;
    let lastAutoRecover = 0;

    /** 是否开启「音频异常自动重载」（默认关，避免打断观看） */
    function autoReloadEnabled() {
      try { return localStorage.getItem('tvbox_autoreload') === '1'; } catch (e) { return false; }
    }
    function saveAutoReload(v) {
      try { localStorage.setItem('tvbox_autoreload', v ? '1' : '0'); } catch (e) {}
    }
    function initAutoReloadChk() {
      const chk = document.getElementById('autoReloadChk');
      if (chk) chk.checked = autoReloadEnabled();
      const ext = document.getElementById('autoExtChk');
      if (ext) ext.checked = autoExtEnabled();
    }

    /** 问题源是否自动交给外部播放器 */
    function autoExtEnabled() {
      try { return localStorage.getItem('tvbox_autoext') === '1'; } catch (e) { return false; }
    }
    function saveAutoExt(v) {
      try { localStorage.setItem('tvbox_autoext', v ? '1' : '0'); } catch (e) {}
    }

    /** 有问题源时显示提示条 */
    function showSourceWarn(disc) {
      const box = document.getElementById('srcWarn');
      const txt = document.getElementById('srcWarnText');
      if (!box || !txt) return;
      if (!disc || disc <= 0) { box.style.display = 'none'; return; }
      txt.textContent = `该源封装有 ${disc} 处时间戳重置，网页播放可能出现声音异常。用外部播放器（PotPlayer）播放可彻底避免。`;
      box.style.display = 'flex';
    }

    /** 高亮 ⟳ 按钮，提示可以手动重载 */
    function highlightReload(ms = 12000) {
      const btn = document.getElementById('btnReload');
      if (!btn) return;
      btn.classList.add('alert');
      clearTimeout(btn._alertTimer);
      btn._alertTimer = setTimeout(() => btn.classList.remove('alert'), ms);
    }

    function armAudioWatch() {
      lastAudioBytes = -1;
      audioStallCount = 0;
    }

    function startAudioWatch() {
      if (audioWatchTimer) return;
      audioWatchTimer = setInterval(() => {
        const view = document.getElementById('playerView');
        if (!view || !view.classList.contains('active')) return;

        const v = pvVideo;
        if (!v || v.paused || v.seeking || v.ended || v.readyState < 3) { armAudioWatch(); return; }
        if (v.muted || v.volume === 0) { armAudioWatch(); return; }   // 静音时不判断

        const bytes = v.webkitAudioDecodedByteCount || v.mozAudioDecodedByteCount || 0;
        if (!bytes) return;                                            // 浏览器不支持该指标

        window.__audioDebug = { bytes, stalls: audioStallCount, recovers: window.__autoRecoverCount || 0 };

        if (bytes === lastAudioBytes) {
          audioStallCount++;
          if (audioStallCount >= 3) {                                  // 约 9 秒没有新音频数据
            const now = Date.now();
            audioStallCount = 0;

            if (autoReloadEnabled()) {
              // 用户主动开启：自动恢复
              if (now - lastAutoRecover > 30000) {
                lastAutoRecover = now;
                window.__autoRecoverCount = (window.__autoRecoverCount || 0) + 1;
                showToast('检测到音频异常，正在自动重载…', 3000);
                reloadCurrentEpisode(true);
              }
            } else {
              // 默认：只提示，不打断观看
              if (now - lastAutoRecover > 30000) {
                lastAutoRecover = now;
                window.__autoHintCount = (window.__autoHintCount || 0) + 1;
                showToast('音频似乎不太对？点右下角 ⟳ 可重载本集', 4000);
                highlightReload();
              }
            }
          }
        } else {
          lastAudioBytes = bytes;
          audioStallCount = 0;
        }
      }, 3000);
    }

    initAutoReloadChk();
    startAudioWatch();

    attachSlider(
      document.getElementById('volBar'),
      (p) => {
        pvVideo.muted = p === 0;
        pvVideo.volume = Math.min(1, Math.max(0, p));
        paintSlider('volFill', 'volThumb', pvVideo.muted ? 0 : pvVideo.volume);
        document.getElementById('btnMute').innerHTML =
          (pvVideo.muted || pvVideo.volume === 0) ? ICON.mute : ICON.vol;
      }
    );

    function updateControls() {
      const dur = isFinite(pvVideo.duration) ? pvVideo.duration : 0;

      if (!isSeekDragging() && !seeking) {
        const durLabel = !isFinite(dur) ? (dur === Infinity ? '直播' : '--:--') : fmtTime(dur);
        document.getElementById('ctrlTime').textContent =
          `${fmtTime(pvVideo.currentTime)} / ${durLabel}`;
        paintSlider('seekFill', 'seekThumb', dur > 0 ? pvVideo.currentTime / dur : 0);
      }

      // 缓冲进度
      try {
        if (dur > 0 && pvVideo.buffered && pvVideo.buffered.length) {
          const end = pvVideo.buffered.end(pvVideo.buffered.length - 1);
          document.getElementById('seekBuffer').style.width =
            Math.min(100, (end / dur) * 100) + '%';
        }
      } catch (e) {}

      document.getElementById('btnPlay').innerHTML = pvVideo.paused ? ICON.play : ICON.pause;
      document.getElementById('btnMute').innerHTML = (pvVideo.muted || pvVideo.volume === 0) ? ICON.mute : ICON.vol;
      paintSlider('volFill', 'volThumb', pvVideo.muted ? 0 : pvVideo.volume);
    }

    ['timeupdate', 'durationchange', 'loadedmetadata', 'play', 'pause',
      'volumechange', 'seeking', 'seeked', 'emptied'].forEach(ev =>
      pvVideo.addEventListener(ev, updateControls));

    document.getElementById('btnFull').innerHTML = ICON.full;
    document.getElementById('btnReload').innerHTML = ICON.reload;
    updateControls();

    function togglePlay() {
      if (pvVideo.paused) pvVideo.play().catch(() => {});
      else pvVideo.pause();
      showBars();
    }

    function toggleMute() {
      pvVideo.muted = !pvVideo.muted;
      if (!pvVideo.muted && pvVideo.volume === 0) pvVideo.volume = 1;
      updateControls();
      showBars();
    }

    function setRate(rate) {
      pvVideo.playbackRate = Number(rate);
      showBars();
    }

    // 点画面暂停/播放，双击全屏
    document.getElementById('pvStage').addEventListener('click', (e) => {
      if (e.target.id !== 'h5Player') return;
      togglePlay();
    });
    pvVideo.addEventListener('dblclick', () => toggleFullscreen());

    function toggleFullscreen() {
      const view = document.getElementById('playerView');
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else {
        view.requestFullscreen().catch(() => {
          const v = document.getElementById('h5Player');
          if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
        });
      }
    }

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      const view = document.getElementById('playerView');
      if (!view.classList.contains('active')) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

      const v = document.getElementById('h5Player');
      switch (e.code) {
        case 'Space':
          e.preventDefault();
          v.paused ? v.play() : v.pause();
          break;
        case 'ArrowRight':
          e.preventDefault();
          seekTo(Math.min(v.duration || 0, v.currentTime + 10));
          break;
        case 'ArrowLeft':
          e.preventDefault();
          seekTo(Math.max(0, v.currentTime - 10));
          break;
        case 'ArrowUp':
          e.preventDefault();
          v.volume = Math.min(1, v.volume + 0.1);
          break;
        case 'ArrowDown':
          e.preventDefault();
          v.volume = Math.max(0, v.volume - 0.1);
          break;
        case 'KeyF':
          e.preventDefault();
          toggleFullscreen();
          break;
        case 'Escape':
          if (!document.fullscreenElement) closePlayer();
          break;
      }
    });

    function showStatus(text) {
      const msg = document.getElementById('statusMsg');
      const grid = document.getElementById('videoGrid');
      grid.style.display = 'none';
      msg.style.display = 'block';
      msg.textContent = text;
    }
